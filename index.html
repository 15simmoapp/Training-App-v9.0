<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f2"><title>Matthew's Training App</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script></head><body>
<header><div><small>MATTHEW'S</small><h1>Training App</h1></div><div><button id="theme">◐</button><button id="timerOpen">⏱</button></div></header>
<main><section id="home" class="view active"></section><section id="blocks" class="view"></section><section id="sessions" class="view"></section><section id="workout" class="view"></section><section id="quests" class="view"></section><section id="progress" class="view"></section></main>
<nav><button data-v="home" class="active">⌂<span>Home</span></button><button data-v="sessions">▦<span>Sessions</span></button><button data-v="blocks">＋<span>Block</span></button><button data-v="quests">◇<span>Quests</span></button><button data-v="progress">↗<span>Progress</span></button></nav>
<dialog id="timer"><div class="modal"><div class="between"><h2>Rest timer</h2><button onclick="timer.close()">×</button></div><div id="clock">01:30</div><div class="quick"><button data-s="60">1:00</button><button data-s="90">1:30</button><button data-s="120">2:00</button><button data-s="180">3:00</button></div><button id="timerToggle" class="primary full">Start</button></div></dialog>
<dialog id="stop"><div class="modal"><h2>Tap out safely</h2><label>Reason<select id="stopReason"><option>Pain or possible injury</option><option>Unwell or dizzy</option><option>Equipment issue</option><option>Time constraint</option><option>Other</option></select></label><label>Note<textarea id="stopNote"></textarea></label><button id="stopConfirm" class="danger full">Stop session</button></div></dialog>
<div id="toast"></div><script src="app.js"></script></body></html>
